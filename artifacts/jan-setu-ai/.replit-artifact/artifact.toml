kind = "web"
previewPath = "/"
title = "JanSetu AI"
description = "A hackathon-ready AI governance platform foundation that turns citizen requests into transparent development priorities for policymakers using synthetic demo data."
version = "1.0.0"
id = "artifacts/jan-setu-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21872

[services.development]
run = "pnpm --filter @workspace/jan-setu-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jan-setu-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/jan-setu-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21872"
BASE_PATH = "/"

[[services]]
name = "python-api"
paths = [ "/jan-setu-api" ]
localPort = 8000

[services.development]
run = "python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

[services.env]
BACKEND_PORT = "8000"
